<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#080D1A"/>
  <circle cx="256" cy="256" r="240" fill="url(#iconGlow)"/>

  <!-- Science Bit -->
  <text x="256" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="62" font-weight="bold" text-anchor="middle">
    <tspan fill="#FFFFFF">Science </tspan><tspan fill="#0066FF">Bit</tspan>
  </text>

  <!-- — COMPUTER — -->
  <!-- COMPUTER at font-size 19 with letter-spacing 6 is ~152px wide (from 180 to 332) -->
  <!-- Left line: 94 to 154 (26px gap before 'C') -->
  <!-- Right line: 358 to 418 (26px gap after 'R') -->
  <line x1="94" y1="281" x2="154" y2="281" stroke="#0066FF" stroke-width="4.5" stroke-linecap="round"/>
  <text x="256" y="288" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF" letter-spacing="6">COMPUTER</text>
  <line x1="358" y1="281" x2="418" y2="281" stroke="#0066FF" stroke-width="4.5" stroke-linecap="round"/>
</svg>